<!doctype html><html><head><meta charset="utf-8"><title>Dot Magnifier</title>
<style>html,body{margin:0;height:100%;background:transparent}#out{position:fixed;inset:0;width:100%;height:100%;display:block}</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
</head><body>
<canvas id="out"></canvas>
<script>
/* ===================== POSITION / MOTION CONFIG =====================
   Edit here, OR override in the iframe URL, e.g.
   magnifier-dots.html?camZ=4&posX=-0.1&posY=0.05&size=0.9&sway=0.1
   camZ = zoom (bigger = further/smaller)   camY = camera height   tgtX/tgtY = look-at (nudge left-right / up-down)   fov = lens
   rot = spin speed per frame (0 = still)   spin0 = starting angle (rad)   sway = hand motion amount (0.2; 0 = still, 0.1 = subtle, 0.3 = lively)
   seed = texture variation   posX/posY = move the lens (its centre) in frame   size = scale (1.0)
   snow = share of the hand that is bright (1 = solid dots like the tile; lower = mottled)   ring = lens rim brightness (0.40; lower = fainter, 0.22 = very faint)
   cut = dot brightness cutoff (0.55)
   dot = dot size (0.72; 1 = original, lower = finer)   dc = dot colour hex, e.g. dc=ffffff
   Framed like the current 4:3 "Meet Compliance Requirements" tile: big faint lens left of centre, thumb + fingertips entering bottom-right.  */
const Q=new URLSearchParams(location.search); const num=(k,d)=>{const v=parseFloat(Q.get(k));return isNaN(v)?d:v;};
// opened directly (not in an iframe) -> show the tile's gradient so the white dots are visible; embedded stays transparent (?bg=1 / ?bg=0 to force)
let framed=true; try{ framed=window.self!==window.top; }catch(e){}
if(Q.get('bg')==='1'||(!framed&&Q.get('bg')!=='0')) document.documentElement.style.background='linear-gradient(130.796deg,#071231 0%,#0243a9 50%,#759ad0 100%) fixed';
const CONFIG={ camX:num('camX',0), camY:num('camY',0), camZ:num('camZ',3.49),
  tgtX:num('tgtX',0), tgtY:num('tgtY',0), fov:num('fov',32),          // camZ 3.49 + fov 32 -> the frame is 2 units tall
  posX:num('posX',-0.16), posY:num('posY',0.12),                     // lens centre in frame units (x: -1.33..1.33 at 4:3, y: -1..1)
  rot:num('rot',0), spin0:num('spin0',-0.28), sway:num('sway',0.2), seed:num('seed',1),
  size:num('size',1.0) };

/* ===================== baked dot-style params (your preset) ===================== */
const DOT=num('dot',0.72);   // dot size + grid spacing scale (1 = the original mountain preset)
const P={ spacing:10*DOT, minSize:2.6*DOT, maxSize:5.2*DOT, dotOpacity:0.62, threshold:0, softness:1,
  brightness:0.0, contrast:1.8, gamma:0.6, invert:0, cutoff:num('cut',0.55), cutoffSoft:0.1, invertMask:0,
  chroma:1, chromaColor:[0,1,0], chromaThresh:0.28, chromaSoft:0.12, dotColor:(Q.get('dc')||'ffffff').match(/../g).map(h=>parseInt(h,16)/255), shaderOpacity:1, refH:1200 };   // dot sizes are in px at a 1200px-tall frame
const KEYGREEN=0x00ff00;

/* ===================== Three.js magnifier + hand -> hidden source canvas (on green) ===================== */
const src=document.createElement('canvas');
const three=new THREE.WebGLRenderer({canvas:src,antialias:true}); three.setPixelRatio(1); three.outputEncoding=THREE.sRGBEncoding;
three.shadowMap.enabled=true; three.shadowMap.type=THREE.PCFSoftShadowMap;   // self-shadowing = dark creases between the fingers
const tScene=new THREE.Scene(); tScene.background=new THREE.Color(KEYGREEN);
const tCam=new THREE.PerspectiveCamera(CONFIG.fov,1,0.1,100); tCam.position.set(CONFIG.camX,CONFIG.camY,CONFIG.camZ); tCam.lookAt(CONFIG.tgtX,CONFIG.tgtY,0);
tScene.add(new THREE.HemisphereLight(0xdfe8ff,0x2a1e16,0.30));                // lower fill -> deeper shadows
const key=new THREE.DirectionalLight(0xfff1df,1.45); key.position.set(-3.5,5.5,5); key.castShadow=true;
key.shadow.mapSize.set(2048,2048); key.shadow.camera.near=0.5; key.shadow.camera.far=22;
key.shadow.camera.left=-2.6;key.shadow.camera.right=2.6;key.shadow.camera.top=2.6;key.shadow.camera.bottom=-2.6;
key.shadow.bias=-0.0006; tScene.add(key);
const rim=new THREE.DirectionalLight(0xbcd2ff,0.28); rim.position.set(4,1.5,-4); tScene.add(rim);

/* ---- noise: value noise + fBm + ridged multifractal ---- */
const SEED=CONFIG.seed*97.13;
function fract(x){return x-Math.floor(x);} function hash3(i,j,k){return fract(Math.sin((i+SEED)*127.1+(j)*311.7+(k)*74.7)*43758.5453);} function smt(t){return t*t*(3-2*t);}
function vnoise(x,y,z){const ix=Math.floor(x),iy=Math.floor(y),iz=Math.floor(z),fx=x-ix,fy=y-iy,fz=z-iz;const u=smt(fx),v=smt(fy),w=smt(fz);const L=(a,b,t)=>a+(b-a)*t,C=(dx,dy,dz)=>hash3(ix+dx,iy+dy,iz+dz);const x00=L(C(0,0,0),C(1,0,0),u),x10=L(C(0,1,0),C(1,1,0),u),x01=L(C(0,0,1),C(1,0,1),u),x11=L(C(0,1,1),C(1,1,1),u);return L(L(x00,x10,v),L(x01,x11,v),w);}
function fbm(x,y,z){let a=0,amp=0.5,f=1;for(let o=0;o<5;o++){a+=amp*vnoise(x*f,y*f,z*f);f*=2.03;amp*=0.5;}return a;}
function snoise(x,y,z){return vnoise(x,y,z)*2-1;}
function ridgedMF(x,y,z){ let sum=0,f=1,w=0.55,prev=1; for(let o=0;o<6;o++){ let n=1-Math.abs(snoise(x*f,y*f,z*f)); n=n*n; sum+=n*w*prev; prev=Math.min(1,n*2.2); f*=2.07; w*=0.5; } return sum; } // 0..~1, sharp ridges
function ss(e0,e1,x){x=Math.max(0,Math.min(1,(x-e0)/(e1-e0)));return x*x*(3-2*x);}
function mix(a,b,t){t=Math.max(0,Math.min(1,t));return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}

/* ---- build the magnifier + hand (units: lens radius = 1, lens centre = origin; x right, y up, z to camera) ----
   Pose traced from the reference: we look at the thumb side of a right hand. The thumb lies in FRONT of the
   handle pointing up-left (nail beside the handle); index / middle / ring fingers wrap round BEHIND the handle
   and their tips poke out on its left, stacked top to bottom; the back of the hand + wrist leave the frame
   bottom-right. Fingers are tapered tubes with knuckle bulges at the joints. Lens = torus rim, no glass. */
const V=new THREE.Vector3(), parts=[];
function tube(pts, r0, r1, joints, tip, flatZ){   // tapered tube along a Catmull-Rom curve; joints=[[t,bulge],..]; flatZ squashes depth
  const curve=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p))), TS=56, RS=20;
  const g=new THREE.TubeGeometry(curve,TS,1,RS,false), pos=g.attributes.position;
  for(let i=0;i<=TS;i++){ const t=i/TS, c=curve.getPointAt(t);
    let r=r0+(r1-r0)*t; for(const [jt,jb] of joints) r*=1+jb*Math.exp(-Math.pow((t-jt)/0.07,2));
    for(let j=0;j<=RS;j++){ const k=i*(RS+1)+j; V.fromBufferAttribute(pos,k).sub(c).multiplyScalar(r); V.z*=flatZ||1; V.add(c); pos.setXYZ(k,V.x,V.y,V.z); } }
  parts.push(g);
  if(tip){ const e=curve.getPointAt(1), s=new THREE.SphereGeometry(r1,20,14); s.scale(1,1,flatZ||1); s.translate(e.x,e.y,e.z); parts.push(s); }
  return curve;
}
function blob(c, r, rot){ const g=new THREE.SphereGeometry(1,44,30); g.scale(r[0],r[1],r[2]); if(rot) g.rotateZ(rot); g.translate(c[0],c[1],c[2]); parts.push(g); }
// handle: leaves the rim at ~-55 deg, disappears behind the thumb
const HA=-0.96, hx=Math.cos(HA), hy=Math.sin(HA), hp=d=>[hx*d, hy*d, 0];
tube([hp(0.98),hp(1.10),hp(1.20)], 0.12, 0.11, [[0.5,0.10]], false);              // ferrule at the rim
tube([hp(1.15),hp(1.6),hp(2.1),hp(2.55)], 0.10, 0.115, [], false);
const NHANDLE=parts.length;   // handle parts are black (like the reference) -> no dots
// back of the hand, thumb muscle and wrist (mostly off-frame, bottom-right)
blob([2.16,-1.86,-0.30],[1.05,0.34,0.30],-0.96);  // side of the index hand-bone: a strip parallel to the thumb (dark valley between)
blob([2.95,-2.30,-0.52],[1.10,0.46,0.30],-0.96);  // back of the hand, next strip over, leaving the frame
blob([2.32,-2.42,-0.10],[0.66,0.58,0.40],0.9);     // thumb muscle
tube([[2.75,-2.25,-0.36],[3.30,-2.95,-0.42],[3.9,-3.7,-0.5]], 0.72, 0.80, [], false);
// fingers wrapping behind the handle: knuckle (behind, right) -> proximal -> PIP joint -> tip (poking out left)
function finger(y, tipX, knX, r0, r1){
  tube([[knX+0.18,y+0.06,-0.40],[knX-0.32,y+0.03,-0.38],[(knX+tipX)*0.5-0.05,y-0.01,-0.28],[tipX+0.20,y-0.02,-0.10],[tipX,y+0.01,0.00]],
       r0, r1, [[0.12,0.10],[0.52,0.09],[0.80,0.06]], true, 0.92); }
finger(-1.34, 0.44, 1.70, 0.235, 0.185);   // index (its tip is the round blob left of the thumb)
finger(-1.86, 0.88, 1.90, 0.245, 0.192);   // middle (peeks out just under the thumb)
finger(-2.36, 0.90, 1.95, 0.230, 0.180);   // ring
finger(-2.80, 1.10, 2.00, 0.195, 0.155);   // little finger (below the frame)
// thumb: in front of the handle, pad pressed against it, pointing up-left; flattened, with a nail near the tip
const th=tube([[2.20,-2.62,0.00],[1.76,-2.02,0.20],[1.42,-1.56,0.27],[1.17,-1.17,0.22]], 0.33, 0.225, [[0.55,0.06]], true, 0.72);
{ const e=th.getPointAt(0.94), d=th.getTangentAt(0.94), nail=new THREE.SphereGeometry(1,24,14);
  nail.scale(0.17,0.13,0.035); nail.rotateZ(Math.atan2(d.y,d.x)); nail.translate(e.x+0.02,e.y-0.02,e.z+0.15); parts.push(nail); }
const all=new THREE.Group(), ringG=new THREE.TorusGeometry(1,0.085,24,180);
parts.forEach(g=>g.computeVertexNormals());
/* ---- vertex colours: like the tile, the hand is bright (solid dots; contrast comes from shading + the shadowed
   gaps between thumb and fingers) and the lens rim is dim so it only gives faint, small dots ----
   ?snow<1 brings back the template's mottled field (threshold by quantile). */
const geos=[ringG,...parts];
const SFs=[], sfv=[];
for(const g of geos){ const pos=g.attributes.position, nrm=g.attributes.normal, SF=new Float32Array(pos.count);
  for(let i=0;i<pos.count;i++){ V.fromBufferAttribute(pos,i);
    const R=ridgedMF(V.x*1.4+3,V.y*1.4,V.z*1.4+1), F=fbm(V.x*7.0+2,V.y*7.0,V.z*7.0+9), G=fbm(V.x*15.0+5,V.y*15.0,V.z*15.0+1);
    const up=Math.max(0,nrm.getZ(i));                                                                     // facing the camera
    SF[i]=0.22*(1-R)+0.36*F+0.32*G+0.10*up; sfv.push(SF[i]); }
  SFs.push(SF); }
const hv=[]; for(let k=1;k<SFs.length;k++) for(const v of SFs[k]) hv.push(v); hv.sort((a,b)=>a-b);
const SNOW=Math.min(1,num('snow',1)), SNOW_LO=SNOW>=1?-1e9:hv[Math.floor(hv.length*(1-SNOW))]-0.03, RING=num('ring',0.40);
const skinTan=[0.06,0.043,0.028], skinMid=[0.03,0.021,0.014], skinDark=[0.008,0.006,0.005], white=[0.98,0.97,0.95]; // linear: darks = gaps, white = dots
const mat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.95,metalness:0,flatShading:true});
geos.forEach((g,gi)=>{ const pos=g.attributes.position, col=new Float32Array(pos.count*3), SF=SFs[gi];
  for(let i=0;i<pos.count;i++){ V.fromBufferAttribute(pos,i);
    const R=fbm(V.x*4+11,V.y*4,V.z*4+5); let c=mix(skinDark,skinTan,ss(0.3,0.7,R)); c=mix(c,skinMid,ss(0.55,0.3,R)*0.35);
    if(g===ringG){ const r=RING*(0.85+0.3*fbm(V.x*6+1,V.y*6,V.z*6)); c=[r,r,r*1.02]; }       // dim rim -> faint dots
    else if(gi-1<NHANDLE) c=[0.01,0.01,0.012];
    else { c=SNOW>=1?white:mix(c,white,ss(SNOW_LO,SNOW_LO+0.06,SF[i]));
      const f=ss(0.18,0.72,g.attributes.normal.getZ(i)); c=mix(skinDark,c,f); }   // edges turning away go dark -> gaps between thumb / fingers
    col[i*3]=c[0]; col[i*3+1]=c[1]; col[i*3+2]=c[2]; }
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  const m=new THREE.Mesh(g,mat); m.castShadow=true; m.receiveShadow=true; all.add(m); });
const S=0.46*CONFIG.size;                      // lens radius ~0.25 of the frame height, like the tile
all.scale.setScalar(S); all.position.set(CONFIG.posX,CONFIG.posY,0); all.rotation.y=CONFIG.spin0; tScene.add(all);
let spinAcc=0; const T0=performance.now();
function animate(){ const t=(performance.now()-T0)/1000, w=CONFIG.sway; spinAcc+=CONFIG.rot;   // hand-held motion: turn, tilt and drift (sway scales it all)
  all.rotation.y=CONFIG.spin0+spinAcc+w*Math.sin(t*0.70);
  all.rotation.x=w*0.70*Math.sin(t*0.53+1.1);
  all.rotation.z=w*0.28*Math.sin(t*0.61+0.4);
  all.position.x=CONFIG.posX+w*0.25*Math.sin(t*0.45+2.0);
  all.position.y=CONFIG.posY+w*0.30*Math.sin(t*0.83); }

/* ===================== dot-grid shader (transparent output) ===================== */
const out=document.getElementById('out');
const gl=out.getContext('webgl',{premultipliedAlpha:true,alpha:true,antialias:false});
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
const VS='attribute vec2 aPos;varying vec2 vUv;void main(){vUv=aPos*0.5+0.5;gl_Position=vec4(aPos,0.,1.);}';
const FS=['precision highp float;varying vec2 vUv;uniform sampler2D uSrc;uniform vec2 uRes;uniform float uCell;',
'uniform float uMinSize,uMaxSize,uDotOpacity;uniform vec3 uDotColor;uniform float uBrightness,uContrast,uGamma,uInvert,uThreshold,uSoftness;',
'uniform float uCutoff,uCutoffSoft,uInvertMask,uShaderOpacity,uChroma,uChromaThresh,uChromaSoft;uniform vec3 uChromaColor;',
'float luma(vec3 c){return dot(c,vec3(0.299,0.587,0.114));}',
'void main(){vec2 fp=vUv*uRes;vec2 cell=floor(fp/uCell);vec2 ctr=(cell+0.5)*uCell;vec3 rgb=texture2D(uSrc,ctr/uRes).rgb;float rawL=luma(rgb);',
'float mask=smoothstep(uCutoff,uCutoff+max(uCutoffSoft,0.001),rawL);if(uInvertMask>0.5)mask=1.0-mask;',
'if(uChroma>0.5){float ky=luma(uChromaColor);vec2 kc=vec2(uChromaColor.b-ky,uChromaColor.r-ky);float py=luma(rgb);vec2 pc=vec2(rgb.b-py,rgb.r-py);mask*=smoothstep(uChromaThresh,uChromaThresh+max(uChromaSoft,0.001),distance(pc,kc));}',
'float L=rawL;L+=uBrightness;L=(L-0.5)*uContrast+0.5;L=clamp(L,0.,1.);L=pow(L,1.0/uGamma);if(uInvert>0.5)L=1.0-L;',
'float dv=smoothstep(uThreshold,uThreshold+max(uSoftness,0.001),L);',
'float hc=uCell*0.5;float rad=min(mix(uMinSize,uMaxSize,dv)*0.5,hc);float d=distance(fp,ctr);float cov=1.0-smoothstep(rad-1.0,rad+1.0,d);',
'float a=cov*uDotOpacity*mask*uShaderOpacity;gl_FragColor=vec4(uDotColor*a,a);}'].join('\n');
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(x));return x;}
const prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(prog);gl.useProgram(prog);
const quad=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,quad);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(prog,'aPos');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
const U=n=>gl.getUniformLocation(prog,n); let RW=0,RH=0;
function resize(){const dpr=Math.min(devicePixelRatio||1,2);const w=Math.max(2,Math.round(out.clientWidth*dpr)),h=Math.max(2,Math.round(out.clientHeight*dpr));if(w===RW&&h===RH)return;RW=w;RH=h;out.width=w;out.height=h;src.width=w;src.height=h;three.setSize(w,h,false);tCam.aspect=w/h;tCam.updateProjectionMatrix();}
let running=true;
function frame(){ if(!running){requestAnimationFrame(frame);return;} resize();
  animate(); three.render(tScene,tCam);
  gl.viewport(0,0,RW,RH); gl.useProgram(prog);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,tex); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src);
  const ds=RH/P.refH;   // dots scale with height, like the camera (vertical FOV) -> same dot density on the magnifier at any aspect
  gl.uniform1i(U('uSrc'),0); gl.uniform2f(U('uRes'),RW,RH); gl.uniform1f(U('uCell'),Math.max(2,P.spacing)*ds);
  gl.uniform1f(U('uMinSize'),P.minSize*ds); gl.uniform1f(U('uMaxSize'),P.maxSize*ds); gl.uniform1f(U('uDotOpacity'),P.dotOpacity);
  gl.uniform3f(U('uDotColor'),P.dotColor[0],P.dotColor[1],P.dotColor[2]);
  gl.uniform1f(U('uBrightness'),P.brightness); gl.uniform1f(U('uContrast'),P.contrast); gl.uniform1f(U('uGamma'),Math.max(0.01,P.gamma));
  gl.uniform1f(U('uInvert'),P.invert); gl.uniform1f(U('uThreshold'),P.threshold); gl.uniform1f(U('uSoftness'),P.softness);
  gl.uniform1f(U('uCutoff'),P.cutoff); gl.uniform1f(U('uCutoffSoft'),P.cutoffSoft); gl.uniform1f(U('uInvertMask'),P.invertMask);
  gl.uniform1f(U('uShaderOpacity'),P.shaderOpacity); gl.uniform1f(U('uChroma'),P.chroma);
  gl.uniform3f(U('uChromaColor'),P.chromaColor[0],P.chromaColor[1],P.chromaColor[2]); gl.uniform1f(U('uChromaThresh'),P.chromaThresh); gl.uniform1f(U('uChromaSoft'),P.chromaSoft);
  gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT); gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(frame);
}
if('IntersectionObserver' in window){ new IntersectionObserver(es=>{running=es[0].isIntersecting;}).observe(out); }
resize(); requestAnimationFrame(frame);
</script></body></html>
