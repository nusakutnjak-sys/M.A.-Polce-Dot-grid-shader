<!doctype html><html><head><meta charset="utf-8"><title>Dot Peak</title>
<style>html,body{margin:0;height:100%;background:transparent}#out{position:fixed;inset:0;width:100%;height:100%;display:block}</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
</head><body>
<canvas id="out"></canvas>
<script>
/* ===================== POSITION / MOTION CONFIG =====================
   Edit here, OR override in the iframe URL, e.g.
   peak-dots.html?camZ=4.2&camY=0.6&tgtY=0.1&rot=0.001&spin0=0.8&seed=3
   camZ = zoom (bigger = further/smaller)   camY = camera height (frames peak up/down)
   tgtX/tgtY = look-at (nudge left-right / up-down)   fov = lens
   rot = spin speed per frame (0 = still)   spin0 = starting angle (rad)
   seed = which mountain variation   posX/posY = move the peak in frame   size = scale (0.80)
   snow = share of the rock that gets dots (0.58; lower = sparser)   cut = dot brightness cutoff (0.55)
   dot = dot size (0.62 = hero size; cards use 0.72)   dc = dot colour hex, e.g. dc=ffffff                                 */
const Q=new URLSearchParams(location.search); const num=(k,d)=>{const v=parseFloat(Q.get(k));return isNaN(v)?d:v;};
// opened directly (not in an iframe) -> show the preset gradient so the white dots are visible; embedded stays transparent (?bg=1 / ?bg=0 to force)
let framed=true; try{ framed=window.self!==window.top; }catch(e){}
if(Q.get('bg')==='1'||(!framed&&Q.get('bg')!=='0')) document.documentElement.style.background='linear-gradient(173deg,#0a0f2c 0%,#0243ac 45%,#f0f1f3 90%) fixed';
const CONFIG={ camX:num('camX',0), camY:num('camY',1.44), camZ:num('camZ',5.44),
  tgtX:num('tgtX',0), tgtY:num('tgtY',1.44), fov:num('fov',32),
  posX:num('posX',-0.10), posY:num('posY',0),        // move the peak in-frame (posY down = toward bottom)
  rot:num('rot',0.0015), spin0:num('spin0',0), seed:num('seed',1),
  size:num('size',0.80) };                              // overall mountain scale (anchored at its base)

/* ===================== baked dot-style params (your preset) ===================== */
const FIXH=num('fixh',1023);   // dots are sized as if the frame were 1023 CSS px tall (the footer compass box at desktop) -> same dot size on every hero
const DOT=num('dot',0.62);   // dot size + grid spacing scale (0.62 = hero size; 1 = the original approved preset)
const P={ spacing:10*DOT, minSize:2.6*DOT, maxSize:5.2*DOT, dotOpacity:0.62, threshold:0, softness:1,
  brightness:0.0, contrast:1.8, gamma:0.6, invert:0, cutoff:num('cut',0.55), cutoffSoft:0.1, invertMask:0,
  chroma:1, chromaColor:[0,1,0], chromaThresh:0.28, chromaSoft:0.12, dotColor:(Q.get('dc')||'ffffff').match(/../g).map(h=>parseInt(h,16)/255), shaderOpacity:1, refH:1200 };   // dot sizes are in px at a 1200px-tall frame
const KEYGREEN=0x00ff00;
const FPS=num('fps',30), SM=num('sm',1024);   // frame-rate cap; shadow map size (was 2048)

/* ===================== Three.js peak -> small source target (on green) ===================== */
const out=document.getElementById('out');
const three=new THREE.WebGLRenderer({canvas:out,alpha:true,premultipliedAlpha:true,antialias:false}); three.setPixelRatio(1);
three.shadowMap.enabled=true; three.shadowMap.type=THREE.PCFSoftShadowMap;   // self-shadowing = strong dark crevices
const tScene=new THREE.Scene(); tScene.background=new THREE.Color(KEYGREEN);
const tCam=new THREE.PerspectiveCamera(CONFIG.fov,1,0.1,100); tCam.position.set(CONFIG.camX,CONFIG.camY,CONFIG.camZ); tCam.lookAt(CONFIG.tgtX,CONFIG.tgtY,0);
tScene.add(new THREE.HemisphereLight(0xdfe8ff,0x2a1e16,0.30));                // lower fill -> deeper shadows
const key=new THREE.DirectionalLight(0xfff1df,1.45); key.position.set(-3.5,5.5,5); key.castShadow=true;
key.shadow.mapSize.set(SM,SM); key.shadow.camera.near=0.5; key.shadow.camera.far=22;
key.shadow.camera.left=-2.6;key.shadow.camera.right=2.6;key.shadow.camera.top=2.6;key.shadow.camera.bottom=-2.6;
key.shadow.bias=-0.0006; tScene.add(key);
const rim=new THREE.DirectionalLight(0xbcd2ff,0.28); rim.position.set(4,1.5,-4); tScene.add(rim);

/* ---- noise: value noise + fBm + ridged multifractal ---- */
const SEED=CONFIG.seed*97.13;
function fract(x){return x-Math.floor(x);} function hash3(i,j,k){return fract(Math.sin((i+SEED)*127.1+(j)*311.7+(k)*74.7)*43758.5453);} function smt(t){return t*t*(3-2*t);}
function vnoise(x,y,z){const ix=Math.floor(x),iy=Math.floor(y),iz=Math.floor(z),fx=x-ix,fy=y-iy,fz=z-iz;const u=smt(fx),v=smt(fy),w=smt(fz);const L=(a,b,t)=>a+(b-a)*t,C=(dx,dy,dz)=>hash3(ix+dx,iy+dy,iz+dz);const x00=L(C(0,0,0),C(1,0,0),u),x10=L(C(0,1,0),C(1,1,0),u),x01=L(C(0,0,1),C(1,0,1),u),x11=L(C(0,1,1),C(1,1,1),u);return L(L(x00,x10,v),L(x01,x11,v),w);}
function fbm(x,y,z){let a=0,amp=0.5,f=1;for(let o=0;o<5;o++){a+=amp*vnoise(x*f,y*f,z*f);f*=2.03;amp*=0.5;}return a;}
function snoise(x,y,z){return vnoise(x,y,z)*2-1;}
function ridgedMF(x,y,z){ let sum=0,f=1,w=0.55,prev=1; for(let o=0;o<6;o++){ let n=1-Math.abs(snoise(x*f,y*f,z*f)); n=n*n; sum+=n*w*prev; prev=Math.min(1,n*2.2); f*=2.07; w*=0.5; } return sum; } // 0..~1, sharp ridges

/* ---- build the massif from the reference skyline ----
   PROF = front-view skyline (x, height) traced from the reference image (1 unit = 400px of the 2000px ref,
   apex at x=0). The heightfield is that skyline "dilated" by a cone: seen from the front the silhouette
   matches the reference, and every cross-section is a pyramid, so it still reads as a peak while rotating. */
const PROF=[[-1.62,0],[-1.47,0.40],[-1.36,0.49],[-1.30,0.60],[-1.18,0.58],[-1.05,0.57],[-0.90,0.585],[-0.78,0.60],
  [-0.73,0.74],[-0.67,0.84],[-0.60,0.91],[-0.50,1.06],[-0.43,1.22],[-0.37,1.28],[-0.31,1.28],[-0.25,1.25],[-0.18,1.33],
  [-0.12,1.44],[-0.06,1.52],[-0.03,1.565],[0.0,1.58],[0.03,1.555],[0.06,1.53],[0.09,1.49],[0.14,1.45],[0.23,1.41],[0.33,1.39],[0.40,1.36],
  [0.50,1.25],[0.60,1.10],[0.70,0.93],[0.82,0.80],[0.97,0.60],[1.08,0.47],[1.17,0.38],[1.30,0.26],[1.40,0.24],
  [1.50,0.27],[1.60,0.22],[1.69,0.15],[1.80,0]];
const H=1.58, KX=2.7, AZ=0.5;             // H = apex height; KX keeps the skyline; side slope = KX*AZ (~1.3, like the old cone)
function prof(x){ if(x<=PROF[0][0]||x>=PROF[PROF.length-1][0]) return 0;
  for(let k=1;k<PROF.length;k++){ const a=PROF[k-1],b=PROF[k]; if(x<=b[0]) return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0]); } return 0; }
// concave flanks: build in a remapped height space, then h = H*(h'/H)^CURVE -> steep top, spreading base.
// The remap is monotonic, so the front skyline is still exactly PROF.
const CURVE=1.35, toI=h=>H*Math.pow(Math.max(0,h)/H,1/CURVE), fromI=h=>H*Math.pow(Math.max(0,h)/H,CURVE);
const PS=[]; for(let x=PROF[0][0];x<=PROF[PROF.length-1][0];x+=0.008) PS.push(x,toI(prof(x)));
// side-view asymmetry (invisible from the front): wandering crest, gentler front / steeper back,
// and off-axis spurs that sit below the front skyline but show up as shoulders when the peak turns side-on
const AZF=0.44, AZB=0.66;
function crestZ(x){ return 0.13*Math.sin(2.1*x+0.6) + 0.05*Math.sin(5.3*x+1.7); }
const SPURS=[ // x, z, height, slope, stretch along its own axis, axis angle
  [ 0.10,-0.52, 1.10, 1.35, 1.9, 0.5],   // big back shoulder -> subsidiary summit on one side
  [-0.30, 0.50, 0.92, 1.45, 1.6,-0.7],   // lower front spur on the other side
  [ 0.55,-0.95, 0.62, 1.30, 1.5, 0.2] ];
const SVC=new Map();   // sideVar depends only on x, and the terrain grid repeats each x on every row
function sideVar(x){ let v=SVC.get(x); if(v===undefined){ v=sideVar0(x); SVC.set(x,v); } return v; }
function sideVar0(x){ return 1+0.9*(fbm(x*2.3+3.1,0.7,1.3)-0.5) + 0.35*(fbm(x*6.5+1.7,2.1,0.4)-0.5); } // side slope varies along the ridge -> kinked side silhouette
// lateral warp: breaks the side flanks into steps/bumps/notches; the crest (zf=0) still exists, so the front skyline is unchanged
function warpZ(x,z){ return 0.30*(fbm(x*2.0+1.3, z*2.4+4.1, 0.3)-0.5) + 0.12*(fbm(x*5.5+7.7, z*6.0+2.2, 1.9)-0.5); }
function massif(x,z){ let best=0; const zf=z-crestZ(x)+warpZ(x,z), az=(zf>0?AZF:AZB)*sideVar(x), zz=(az*zf)*(az*zf), reach=H/KX;
  for(let k=0;k<PS.length;k+=2){ const dx=x-PS[k]; if(dx>reach) continue; if(dx<-reach) break;
    const v=PS[k+1]-KX*Math.sqrt(dx*dx+zz); if(v>best) best=v; }
  for(const [sx,sz,sh,sk,st,sa] of SPURS){ const dx=x-sx, dz=z-sz+0.8*warpZ(x+3,z), ca=Math.cos(sa), sn=Math.sin(sa);
    const a=(dx*ca+dz*sn)/st, b=(-dx*sn+dz*ca); const v=toI(sh)-sk*(Math.sqrt(a*a+b*b+0.012)-0.11); if(v>best) best=v; }   // rounded (not pointy) sub-summits
  return fromI(best); }
const GX0=-1.75, GX1=2.0, GZ=1.35;
const geo=new THREE.PlaneGeometry(GX1-GX0, 2*GZ, 235, 170); geo.rotateX(-Math.PI/2); geo.translate((GX0+GX1)/2,0,0);
const V=new THREE.Vector3(), pos=geo.attributes.position;
function relief(nx,nz,u){
  // domain-warp then ridged MF -> sharp aretes + couloirs
  const wx=nx*1.9 + 0.45*fbm(nx*3.1,u*2.6,nz*3.1);
  const wz=nz*1.9 + 0.45*fbm(nz*3.1+5,u*2.6,nx*3.1);
  return ridgedMF(wx, u*1.7, wz);
}
function spurs(nx,nz){ return ridgedMF(nx*0.85, 3.3, nz*0.85); } // few big radiating ridges / secondary summits
// runs fn(i) for every vertex in slices of ~12ms, so the build never blocks the page in one long task
async function eachVertex(n,fn){ let t=performance.now(); for(let i=0;i<n;i++){ fn(i); if((i&255)===255 && performance.now()-t>12){ await new Promise(r=>setTimeout(r,0)); t=performance.now(); } } }
// pre-computed terrain (peak-terrain.bin.gz: heights + colours for the default seed and snow), so the page
// does not spend seconds on noise maths; any other ?seed / ?snow, or a failed load, computes it as before.
// After changing the terrain code, open peak-dots.html?bake=1 and replace peak-terrain.bin.gz with the downloaded file.
async function loadTerrain(){
  if(Q.get('seed')!==null || Q.get('snow')!==null || Q.get('bake')==='1') return null;
  try{
    const r=await fetch('peak-terrain.bin.gz'); if(!r.ok) return null;
    let buf=await r.arrayBuffer(), dv=new DataView(buf);
    if(dv.getUint32(0,true)!==0x31544b50){   // not "PKT1" yet -> still gzipped
      if(typeof DecompressionStream==='undefined') return null;
      buf=await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer(); dv=new DataView(buf); }
    const n=pos.count;
    if(dv.getUint32(0,true)!==0x31544b50 || dv.getUint32(4,true)!==n || buf.byteLength!==16+n*5) return null;
    const y0=dv.getFloat32(8,true), y1=dv.getFloat32(12,true), Y=new Float32Array(n), C=new Float32Array(n*3), o=16+n*2;
    for(let i=0;i<n;i++) Y[i]=y0+(y1-y0)*dv.getUint16(16+i*2,true)/65535;
    for(let i=0;i<n*3;i++) C[i]=dv.getUint8(o+i)/255;
    return {Y,C};
  }catch(e){ return null; }
}
// ?bake=1: download the computed terrain as peak-terrain.bin.gz (format PKT1: n, y range, Uint16 heights, Uint8 RGB colours)
async function bakeTerrain(col){
  const n=pos.count; let y0=Infinity,y1=-Infinity; for(let i=0;i<n;i++){ const y=pos.getY(i); if(y<y0)y0=y; if(y>y1)y1=y; }
  const buf=new ArrayBuffer(16+n*5), dv=new DataView(buf), o=16+n*2;
  dv.setUint32(0,0x31544b50,true); dv.setUint32(4,n,true); dv.setFloat32(8,y0,true); dv.setFloat32(12,y1,true);
  for(let i=0;i<n;i++) dv.setUint16(16+i*2,Math.max(0,Math.min(65535,Math.round((pos.getY(i)-y0)/(y1-y0)*65535))),true);
  for(let i=0;i<n*3;i++) dv.setUint8(o+i,Math.max(0,Math.min(255,Math.round(col[i]*255))));
  const gz=await new Response(new Blob([buf]).stream().pipeThrough(new CompressionStream('gzip'))).blob();
  const a=document.createElement('a'); a.href=URL.createObjectURL(gz); a.download='peak-terrain.bin.gz'; document.body.appendChild(a); a.click(); a.remove();
}
let peak=null;
async function buildPeak(){
const T=await loadTerrain();
if(T){
  for(let i=0;i<pos.count;i++) pos.setY(i,T.Y[i]);
  geo.computeVertexNormals();
  geo.setAttribute('color', new THREE.BufferAttribute(T.C,3));
} else {
const HT=new Float32Array(pos.count);   // base heights (0 = ground)
await eachVertex(pos.count,i=>{
  V.fromBufferAttribute(pos,i);
  let h=massif(V.x,V.z);
  if(h>0.002){
    const u=Math.min(1,h/H), th=Math.atan2(V.z,V.x), nx=Math.cos(th), nz=Math.sin(th);
    const R=relief(nx,nz,u), S=spurs(nx,nz), C=fbm(V.x*3.3+7, h*3.0, V.z*3.3+3);
    // ribs/couloirs radiating from the summit + crags; fade out at ground level and ease off at the apex
    h += (0.17*(R-0.5) + 0.05*(S-0.5) + 0.09*(C-0.5)) * Math.min(1,h/0.3) * (0.3+0.7*(1-u));
    h += 0.012*Math.sin(u*34.0 + R*5.0);                        // fine strata
  }
  HT[i]=h; V.y = h>0.002 ? h : -0.02;
  pos.setXYZ(i,V.x,V.y,V.z);
});
geo.computeVertexNormals();

/* ---- vertex colours: tan rock ridges, dark crevices, white snow couloirs ---- */
const nrm=geo.attributes.normal, col=[];
// snow field value per vertex; threshold picked so snow covers a fixed share of the rock (URL ?snow=0.45)
const SF=new Float32Array(pos.count), RS=new Float64Array(pos.count), sfv=[];   // RS = relief per vertex (full precision), reused by the colour pass
await eachVertex(pos.count,i=>{ if(HT[i]<=0.002) return; V.fromBufferAttribute(pos,i);
  const u=Math.min(1,HT[i]/H), th=Math.atan2(V.z,V.x), R=relief(Math.cos(th),Math.sin(th),u), up=Math.max(0,nrm.getY(i)); RS[i]=R;
  const F=fbm(V.x*7.0+2, HT[i]*6.0, V.z*7.0+9), G=fbm(V.x*15.0+5, HT[i]*13.0, V.z*15.0+1);
  SF[i]=0.22*(1-R) + 0.36*F + 0.32*G + 0.10*up; sfv.push(SF[i]); });
sfv.sort((a,b)=>a-b); const SNOW_LO=sfv[Math.floor(sfv.length*(1-num('snow',0.58)))]-0.03;
const rockTan=[0.14,0.10,0.065], rockMid=[0.05,0.035,0.024], rockDark=[0.008,0.006,0.005], snow=[0.98,0.97,0.95]; // linear: dark rock = gaps, snow = dots
function ss(e0,e1,x){x=Math.max(0,Math.min(1,(x-e0)/(e1-e0)));return x*x*(3-2*x);}
function mix(a,b,t){t=Math.max(0,Math.min(1,t));return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
await eachVertex(pos.count,i=>{
  V.fromBufferAttribute(pos,i);
  if(HT[i]<=0.002){ col.push(0,0,0); return; }            // ground = black -> below the cutoff -> no dots
  const u=Math.max(0,Math.min(1,HT[i]/H));
  const R=RS[i];   // same relief the snow pass computed for this vertex
  let c=mix(rockDark, rockTan, ss(0.2,0.72, R));           // ridges lighter, crevices dark
  c=mix(c, rockMid, ss(0.5,0.15, R)*0.35);
  // snow patches: couloirs (low relief) + blotchy fields + up-facing ledges -> ~half the surface, like the reference
  let sn = ss(SNOW_LO, SNOW_LO+0.06, SF[i]);
  sn = Math.max(sn, ss(0.92,1.0,u)*0.9);                    // summit cap
  c=mix(c, snow, sn);
  col.push(c[0],c[1],c[2]);
});
geo.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
if(Q.get('bake')==='1') bakeTerrain(col);
}
peak=new THREE.Mesh(geo, new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.95,metalness:0,flatShading:true}));
peak.castShadow=true; peak.receiveShadow=true;   // self-shadow for crevice depth
peak.position.set(CONFIG.posX,CONFIG.posY,0); peak.scale.setScalar(CONFIG.size); peak.rotation.y=CONFIG.spin0; tScene.add(peak);
}
buildPeak();

const ready=()=>!!peak;
function animate(dt){ if(peak) peak.rotation.y+=CONFIG.rot*(dt||16.667)/16.667; }   // rot is per 60 Hz frame, so the speed doesn't depend on the frame rate

/* ===================== dot-grid pass (transparent output) =====================
   The scene renders into a target with one pixel per dot cell (pixel centre = cell centre), then this pass draws the
   dots from it on the same WebGL context. The shader only ever read one pixel per cell, so the dots look the same,
   without rendering the full-size frame or copying it between two contexts every frame. */
const rt=new THREE.WebGLRenderTarget(2,2,{minFilter:THREE.NearestFilter,magFilter:THREE.NearestFilter,format:THREE.RGBAFormat,stencilBuffer:false});
rt.texture.encoding=THREE.sRGBEncoding; rt.texture.generateMipmaps=false;   // same sRGB values the old canvas copy held
const VS='precision highp float;attribute vec3 position;varying vec2 vUv;void main(){vUv=position.xy*0.5+0.5;gl_Position=vec4(position.xy,0.,1.);}';
const FS=['precision highp float;varying vec2 vUv;uniform sampler2D uSrc;uniform vec2 uRes,uGrid;uniform float uCell;',
'uniform float uMinSize,uMaxSize,uDotOpacity;uniform vec3 uDotColor;uniform float uBrightness,uContrast,uGamma,uInvert,uThreshold,uSoftness;',
'uniform float uCutoff,uCutoffSoft,uInvertMask,uShaderOpacity,uChroma,uChromaThresh,uChromaSoft;uniform vec3 uChromaColor;',
'float luma(vec3 c){return dot(c,vec3(0.299,0.587,0.114));}',
'void main(){vec2 fp=vUv*uRes;vec2 cell=floor(fp/uCell);vec2 ctr=(cell+0.5)*uCell;vec3 rgb=texture2D(uSrc,(cell+0.5)/uGrid).rgb;float rawL=luma(rgb);',
'float mask=smoothstep(uCutoff,uCutoff+max(uCutoffSoft,0.001),rawL);if(uInvertMask>0.5)mask=1.0-mask;',
'if(uChroma>0.5){float ky=luma(uChromaColor);vec2 kc=vec2(uChromaColor.b-ky,uChromaColor.r-ky);float py=luma(rgb);vec2 pc=vec2(rgb.b-py,rgb.r-py);mask*=smoothstep(uChromaThresh,uChromaThresh+max(uChromaSoft,0.001),distance(pc,kc));}',
'float L=rawL;L+=uBrightness;L=(L-0.5)*uContrast+0.5;L=clamp(L,0.,1.);L=pow(L,1.0/uGamma);if(uInvert>0.5)L=1.0-L;',
'float dv=smoothstep(uThreshold,uThreshold+max(uSoftness,0.001),L);',
'float hc=uCell*0.5;float rad=min(mix(uMinSize,uMaxSize,dv)*0.5,hc);float d=distance(fp,ctr);float cov=1.0-smoothstep(rad-1.0,rad+1.0,d);',
'float a=cov*uDotOpacity*mask*uShaderOpacity;gl_FragColor=vec4(uDotColor*a,a);}'].join('\n');
const UN={ uSrc:{value:rt.texture}, uRes:{value:new THREE.Vector2()}, uGrid:{value:new THREE.Vector2()}, uCell:{value:0}, uMinSize:{value:0}, uMaxSize:{value:0},
  uDotOpacity:{value:P.dotOpacity}, uDotColor:{value:new THREE.Vector3(P.dotColor[0],P.dotColor[1],P.dotColor[2])},
  uBrightness:{value:P.brightness}, uContrast:{value:P.contrast}, uGamma:{value:Math.max(0.01,P.gamma)}, uInvert:{value:P.invert}, uThreshold:{value:P.threshold}, uSoftness:{value:P.softness},
  uCutoff:{value:P.cutoff}, uCutoffSoft:{value:P.cutoffSoft}, uInvertMask:{value:P.invertMask}, uShaderOpacity:{value:P.shaderOpacity},
  uChroma:{value:P.chroma}, uChromaColor:{value:new THREE.Vector3(P.chromaColor[0],P.chromaColor[1],P.chromaColor[2])}, uChromaThresh:{value:P.chromaThresh}, uChromaSoft:{value:P.chromaSoft} };
const dotScene=new THREE.Scene(), dotCam=new THREE.Camera(), triG=new THREE.BufferGeometry();
triG.setAttribute('position',new THREE.BufferAttribute(new Float32Array([-1,-1,0,3,-1,0,-1,3,0]),3));
const tri=new THREE.Mesh(triG,new THREE.RawShaderMaterial({vertexShader:VS,fragmentShader:FS,uniforms:UN,depthTest:false,depthWrite:false,blending:THREE.NoBlending}));
tri.frustumCulled=false; dotScene.add(tri); three.setClearColor(0x000000,0);
let RW=0,RH=0;
function resize(){const dpr=Math.min(devicePixelRatio||1,2);const w=Math.max(2,Math.round(out.clientWidth*dpr)),h=Math.max(2,Math.round(out.clientHeight*dpr));if(w===RW&&h===RH)return false;RW=w;RH=h;
  three.setSize(w,h,false);
  const ds=(FIXH>0 ? FIXH*dpr : RH)/P.refH;   // fixed dot size (same px as the footer compass at 1023px tall), whatever the section height; ?fixh=0 = scale with height again
  const cell=Math.max(2,P.spacing)*ds, gw=Math.ceil(RW/cell), gh=Math.ceil(RH/cell);
  rt.setSize(gw,gh);
  tCam.setViewOffset(RW,RH,0,RH-gh*cell,gw*cell,gh*cell);   // frame grown to whole cells from the bottom-left, like the dot grid (also sets the aspect)
  UN.uRes.value.set(RW,RH); UN.uGrid.value.set(gw,gh); UN.uCell.value=cell; UN.uMinSize.value=P.minSize*ds; UN.uMaxSize.value=P.maxSize*ds;
  return true; }

/* ===================== render loop: capped frame rate, runs only while visible ===================== */
const STEP=1000/FPS, STILL=Q.get('still')==='1';
let running=true, looping=false, last=0, drawn=false;
function frame(t){ if(!running){looping=false;return;} requestAnimationFrame(frame);
  if(last && t-last<STEP-2) return;
  const sized=resize(); if(STILL && drawn && !sized) return;   // still mode: draw again only after a resize
  const dt=last ? Math.min(t-last,100) : STEP; last=t;
  animate(dt);
  three.setRenderTarget(rt); three.render(tScene,tCam);
  three.setRenderTarget(null); three.render(dotScene,dotCam);
  drawn=ready(); }
function start(){ if(running && !looping){ looping=true; last=0; requestAnimationFrame(frame); } }
if('IntersectionObserver' in window){ new IntersectionObserver(es=>{ running=es[0].isIntersecting; start(); }).observe(out); }
/* ===================== still mode (added for the site: reduced motion) =====================
   still=1 draws the first pose once, then stops all motion. */
if(STILL){ const __anim=animate; let __done=false; animate=function(){ if(!__done){ __done=true; __anim(); } }; }
if(Q.get('still')==='1') CONFIG.rot=0;
resize(); start();
</script></body></html>
