<!doctype html><html><head><meta charset="utf-8"><title>Dot Cube</title>
<style>html,body{margin:0;height:100%;background:transparent}#out{position:fixed;inset:0;width:100%;height:100%;display:block}</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
</head><body>
<canvas id="out"></canvas>
<script>
/* ===================== POSITION / MOTION CONFIG =====================
   Edit here, OR override in the iframe URL, e.g.
   cube-dots.html?turn=4&hold=3&size=1.1&posY=0.05
   camZ = zoom (bigger = further/smaller)   camY = camera height   tgtX/tgtY = look-at (nudge left-right / up-down)   fov = lens
   turn = seconds for each quarter turn   hold = seconds it rests corner-on between turns (0 = spin continuously)
   tilt = how far we look down onto the top face (rad, 0.75)   spin0 = starting angle (rad; 0.72 = corner-on like the tile)
   seed = texture variation   posX/posY = move the cube in frame   size = scale (1.0)
   top = top-face brightness (0.98 = strong dots)   side = side-face light response (0.10)   glow = side-face even glow (0.28; both together = faint sides)
   cut = dot brightness cutoff (0.55)   dot = dot size (0.72 = same as the other pages)   dc = dot colour hex (ffffff)   op = dot opacity (0.62)
   Framed for the blue "Make Our IT Work Better" tile: cube a little below the middle, ~45% of the tile height.  */
const Q=new URLSearchParams(location.search); const num=(k,d)=>{const v=parseFloat(Q.get(k));return isNaN(v)?d:v;};

/* ===================== hover mode (added for the site's service tiles) =====================
   hover=1 starts still; the page then plays on {dots:'play'} and holds on {dots:'pause'}
   (postMessage from the tile). The animation clock only runs while playing, so motion
   resumes where it stopped. t0 = seconds already "played" before the still frame.  */
const __pn=performance.now.bind(performance); let __held=Q.get('hover')==='1', __acc=num('t0',0)*1000, __last=__pn();
function __now(){ const n=__pn(); if(!__held) __acc+=n-__last; __last=n; return __acc; }
window.addEventListener('message',e=>{ const d=e.data&&e.data.dots; if(d==='play'||d==='pause'){ __now(); __held=d==='pause'; } });   // bring the clock up to date first, so the paused time is never counted
// opened directly (not in an iframe) -> show the tile's blue so the white dots are visible; embedded stays transparent (?bg=1 / ?bg=0 to force)
let framed=true; try{ framed=window.self!==window.top; }catch(e){}
if(Q.get('bg')==='1'||(!framed&&Q.get('bg')!=='0')) document.documentElement.style.background='#0672d2';
const CONFIG={ camX:num('camX',0), camY:num('camY',0), camZ:num('camZ',3.49),
  tgtX:num('tgtX',0), tgtY:num('tgtY',0), fov:num('fov',32),          // camZ 3.49 + fov 32 -> the frame is ~2 units tall
  posX:num('posX',-0.03), posY:num('posY',0),
  turn:num('turn',5), hold:num('hold',4.5), tilt:num('tilt',0.75), spin0:num('spin0',0.72), seed:num('seed',1),
  size:num('size',1.0) };

/* ===================== baked dot-style params (your preset) ===================== */
const DOT=num('dot',0.72);   // dot size + grid spacing scale (1 = the original mountain preset; 0.72 = same as the other pages)
const P={ spacing:10*DOT, minSize:2.6*DOT, maxSize:5.2*DOT, dotOpacity:num('op',0.62), threshold:0, softness:1,
  brightness:0.0, contrast:1.8, gamma:0.6, invert:0, cutoff:num('cut',0.55), cutoffSoft:0.1, invertMask:0,
  chroma:1, chromaColor:[0,1,0], chromaThresh:0.28, chromaSoft:0.12, dotColor:(Q.get('dc')||'ffffff').match(/../g).map(h=>parseInt(h,16)/255), shaderOpacity:1, refH:1200 };   // dot sizes are in px at a 1200px-tall frame
const KEYGREEN=0x00ff00;
const FPS=num('fps',30), SM=num('sm',1024);   // frame-rate cap; shadow map size (was 2048)

/* ===================== Three.js cube -> small source target (on green) ===================== */
const out=document.getElementById('out');
const three=new THREE.WebGLRenderer({canvas:out,alpha:true,premultipliedAlpha:true,antialias:false}); three.setPixelRatio(1);
three.shadowMap.enabled=true; three.shadowMap.type=THREE.PCFSoftShadowMap;   // soft self-shadowing
const tScene=new THREE.Scene(); tScene.background=new THREE.Color(KEYGREEN);
const tCam=new THREE.PerspectiveCamera(CONFIG.fov,1,0.1,100); tCam.position.set(CONFIG.camX,CONFIG.camY,CONFIG.camZ); tCam.lookAt(CONFIG.tgtX,CONFIG.tgtY,0);
tScene.add(new THREE.HemisphereLight(0xdfe8ff,0x2a1e16,0.30));                // lower fill -> deeper shadows
const key=new THREE.DirectionalLight(0xfff1df,1.45); key.position.set(-3.5,5.5,5); key.castShadow=true;
key.shadow.mapSize.set(SM,SM); key.shadow.camera.near=0.5; key.shadow.camera.far=22;
key.shadow.camera.left=-2.6;key.shadow.camera.right=2.6;key.shadow.camera.top=2.6;key.shadow.camera.bottom=-2.6;
key.shadow.bias=-0.0006; tScene.add(key);
const rim=new THREE.DirectionalLight(0xbcd2ff,0.28); rim.position.set(4,1.5,-4); tScene.add(rim);

/* ---- noise: value noise + fBm + ridged multifractal ---- */
const SEED=CONFIG.seed*97.13;
function fract(x){return x-Math.floor(x);} function hash3(i,j,k){return fract(Math.sin((i+SEED)*127.1+(j)*311.7+(k)*74.7)*43758.5453);} function smt(t){return t*t*(3-2*t);}
function vnoise(x,y,z){const ix=Math.floor(x),iy=Math.floor(y),iz=Math.floor(z),fx=x-ix,fy=y-iy,fz=z-iz;const u=smt(fx),v=smt(fy),w=smt(fz);const L=(a,b,t)=>a+(b-a)*t,C=(dx,dy,dz)=>hash3(ix+dx,iy+dy,iz+dz);const x00=L(C(0,0,0),C(1,0,0),u),x10=L(C(0,1,0),C(1,1,0),u),x01=L(C(0,0,1),C(1,0,1),u),x11=L(C(0,1,1),C(1,1,1),u);return L(L(x00,x10,v),L(x01,x11,v),w);}
function fbm(x,y,z){let a=0,amp=0.5,f=1;for(let o=0;o<5;o++){a+=amp*vnoise(x*f,y*f,z*f);f*=2.03;amp*=0.5;}return a;}
function snoise(x,y,z){return vnoise(x,y,z)*2-1;}
function ridgedMF(x,y,z){ let sum=0,f=1,w=0.55,prev=1; for(let o=0;o<6;o++){ let n=1-Math.abs(snoise(x*f,y*f,z*f)); n=n*n; sum+=n*w*prev; prev=Math.min(1,n*2.2); f*=2.07; w*=0.5; } return sum; } // 0..~1, sharp ridges
function ss(e0,e1,x){x=Math.max(0,Math.min(1,(x-e0)/(e1-e0)));return x*x*(3-2*x);}
function mix(a,b,t){t=Math.max(0,Math.min(1,t));return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}


/* ---- build the cube (edge = 1, centred) ----
   Like the tile: the top face is bright (strong, full dots), the side faces are dimmer and fade toward the bottom
   (small, sparse dots), so the cube reads as a lit diamond on top of two ghostly sides. Slightly bevelled edges
   (a few segments) keep the silhouette from being a perfect vector square. */
const TOP=num('top',0.98), SIDE=num('side',0.10), GLOW=num('glow',0.28);   // sides: low light response + an even glow -> both sides faint, whichever way they face
const g=new THREE.BoxGeometry(1,1,1,6,6,6), pos=g.attributes.position, nrm=g.attributes.normal, V=new THREE.Vector3();
for(let i=0;i<pos.count;i++){ V.fromBufferAttribute(pos,i); const r=0.035;             // round the edges a touch
  const cx=Math.max(-0.5+r,Math.min(0.5-r,V.x)), cy=Math.max(-0.5+r,Math.min(0.5-r,V.y)), cz=Math.max(-0.5+r,Math.min(0.5-r,V.z));
  const d=new THREE.Vector3(V.x-cx,V.y-cy,V.z-cz); if(d.length()>1e-6){ d.setLength(r); V.set(cx+d.x,cy+d.y,cz+d.z); } pos.setXYZ(i,V.x,V.y,V.z); }
g.computeVertexNormals();
const col=new Float32Array(pos.count*3), SNOW=Math.min(1,num('snow',1)), dark=[0.008,0.006,0.005];
for(let i=0;i<pos.count;i++){ V.fromBufferAttribute(pos,i); const ny=nrm.getY(i);
  let a = ny>0.7 ? TOP : ny<-0.7 ? 0.05 : SIDE*(0.35+0.65*ss(-0.5,0.5,V.y));        // sides fade toward the bottom
  let c=[a,a*0.99,a*0.97];
  if(SNOW<1){ const F=fbm(V.x*7,V.y*7,V.z*7+2), G=fbm(V.x*15+5,V.y*15,V.z*15); if(0.55*F+0.45*G<1-SNOW*0.9) c=dark; }
  col[i*3]=c[0]; col[i*3+1]=c[1]; col[i*3+2]=c[2]; }
g.setAttribute('color',new THREE.BufferAttribute(col,3));
// BoxGeometry groups: 0 +x, 1 -x, 2 +y (top), 3 -y, 4 +z, 5 -z -> the four sides get the glow material
const topM=new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.95,metalness:0,flatShading:true});
const sideM=new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.95,metalness:0,flatShading:true,emissive:new THREE.Color(GLOW,GLOW,GLOW)});
const cube=new THREE.Mesh(g,[sideM,sideM,topM,topM,sideM,sideM]);
cube.castShadow=true; cube.receiveShadow=true;
const tiltG=new THREE.Group(); tiltG.add(cube); tiltG.rotation.x=CONFIG.tilt;               // look down onto the top face
// frame like the tile: ~0.9 of the 2-unit frame height, centred a little below the middle
const EDGE=0.56*CONFIG.size; tiltG.scale.setScalar(EDGE); tiltG.position.set(CONFIG.posX,-0.30+CONFIG.posY,0); tScene.add(tiltG);
cube.rotation.y=CONFIG.spin0;
const easeIO=t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const T0=0;   // the hover clock starts at the t0 head start, so time is measured from 0
function animate(){ const t=(__now()-T0)/1000;                                    // quarter turn, rest corner-on, repeat
  const cyc=CONFIG.turn+CONFIG.hold, k=Math.floor(t/cyc), f=Math.min(1,(t-k*cyc)/Math.max(0.01,CONFIG.turn));
  cube.rotation.y=CONFIG.spin0+(k+(CONFIG.hold>0?easeIO(f):f))*Math.PI/2; }

const ready=()=>true;

/* ===================== dot-grid pass (transparent output) =====================
   The scene renders into a target with one pixel per dot cell (pixel centre = cell centre), then this pass draws the
   dots from it on the same WebGL context. The shader only ever read one pixel per cell, so the dots look the same,
   without rendering the full-size frame or copying it between two contexts every frame. */
const rt=new THREE.WebGLRenderTarget(2,2,{minFilter:THREE.NearestFilter,magFilter:THREE.NearestFilter,format:THREE.RGBAFormat,stencilBuffer:false});
rt.texture.encoding=THREE.sRGBEncoding; rt.texture.generateMipmaps=false;   // same sRGB values the old canvas copy held
const VS='precision highp float;attribute vec3 position;varying vec2 vUv;void main(){vUv=position.xy*0.5+0.5;gl_Position=vec4(position.xy,0.,1.);}';
const FS=['precision highp float;varying vec2 vUv;uniform sampler2D uSrc;uniform vec2 uRes,uGrid;uniform float uCell;',
'uniform float uMinSize,uMaxSize,uDotOpacity;uniform vec3 uDotColor;uniform float uBrightness,uContrast,uGamma,uInvert,uThreshold,uSoftness;',
'uniform float uCutoff,uCutoffSoft,uInvertMask,uShaderOpacity,uChroma,uChromaThresh,uChromaSoft;uniform vec3 uChromaColor;',
'float luma(vec3 c){return dot(c,vec3(0.299,0.587,0.114));}',
'void main(){vec2 fp=vUv*uRes;vec2 cell=floor(fp/uCell);vec2 ctr=(cell+0.5)*uCell;vec3 rgb=texture2D(uSrc,(cell+0.5)/uGrid).rgb;float rawL=luma(rgb);',
'float mask=smoothstep(uCutoff,uCutoff+max(uCutoffSoft,0.001),rawL);if(uInvertMask>0.5)mask=1.0-mask;',
'if(uChroma>0.5){float ky=luma(uChromaColor);vec2 kc=vec2(uChromaColor.b-ky,uChromaColor.r-ky);float py=luma(rgb);vec2 pc=vec2(rgb.b-py,rgb.r-py);mask*=smoothstep(uChromaThresh,uChromaThresh+max(uChromaSoft,0.001),distance(pc,kc));}',
'float L=rawL;L+=uBrightness;L=(L-0.5)*uContrast+0.5;L=clamp(L,0.,1.);L=pow(L,1.0/uGamma);if(uInvert>0.5)L=1.0-L;',
'float dv=smoothstep(uThreshold,uThreshold+max(uSoftness,0.001),L);',
'float hc=uCell*0.5;float rad=min(mix(uMinSize,uMaxSize,dv)*0.5,hc);float d=distance(fp,ctr);float cov=1.0-smoothstep(rad-1.0,rad+1.0,d);',
'float a=cov*uDotOpacity*mask*uShaderOpacity;gl_FragColor=vec4(uDotColor*a,a);}'].join('\n');
const UN={ uSrc:{value:rt.texture}, uRes:{value:new THREE.Vector2()}, uGrid:{value:new THREE.Vector2()}, uCell:{value:0}, uMinSize:{value:0}, uMaxSize:{value:0},
  uDotOpacity:{value:P.dotOpacity}, uDotColor:{value:new THREE.Vector3(P.dotColor[0],P.dotColor[1],P.dotColor[2])},
  uBrightness:{value:P.brightness}, uContrast:{value:P.contrast}, uGamma:{value:Math.max(0.01,P.gamma)}, uInvert:{value:P.invert}, uThreshold:{value:P.threshold}, uSoftness:{value:P.softness},
  uCutoff:{value:P.cutoff}, uCutoffSoft:{value:P.cutoffSoft}, uInvertMask:{value:P.invertMask}, uShaderOpacity:{value:P.shaderOpacity},
  uChroma:{value:P.chroma}, uChromaColor:{value:new THREE.Vector3(P.chromaColor[0],P.chromaColor[1],P.chromaColor[2])}, uChromaThresh:{value:P.chromaThresh}, uChromaSoft:{value:P.chromaSoft} };
const dotScene=new THREE.Scene(), dotCam=new THREE.Camera(), triG=new THREE.BufferGeometry();
triG.setAttribute('position',new THREE.BufferAttribute(new Float32Array([-1,-1,0,3,-1,0,-1,3,0]),3));
const tri=new THREE.Mesh(triG,new THREE.RawShaderMaterial({vertexShader:VS,fragmentShader:FS,uniforms:UN,depthTest:false,depthWrite:false,blending:THREE.NoBlending}));
tri.frustumCulled=false; dotScene.add(tri); three.setClearColor(0x000000,0);
let RW=0,RH=0;
function resize(){const dpr=Math.min(devicePixelRatio||1,2);const w=Math.max(2,Math.round(out.clientWidth*dpr)),h=Math.max(2,Math.round(out.clientHeight*dpr));if(w===RW&&h===RH)return false;RW=w;RH=h;
  three.setSize(w,h,false);
  const ds=RH/P.refH;   // dots scale with height, like the camera (vertical FOV) -> same dot density on the cube at any aspect
  const cell=Math.max(2,P.spacing)*ds, gw=Math.ceil(RW/cell), gh=Math.ceil(RH/cell);
  rt.setSize(gw,gh);
  tCam.setViewOffset(RW,RH,0,RH-gh*cell,gw*cell,gh*cell);   // frame grown to whole cells from the bottom-left, like the dot grid (also sets the aspect)
  UN.uRes.value.set(RW,RH); UN.uGrid.value.set(gw,gh); UN.uCell.value=cell; UN.uMinSize.value=P.minSize*ds; UN.uMaxSize.value=P.maxSize*ds;
  return true; }

/* ===================== render loop: capped frame rate, runs only while visible ===================== */
const STEP=1000/FPS, STILL=Q.get('still')==='1';
let running=true, looping=false, last=0, drawn=false;
// too-slow guard: when this device draws well under 15 fps (no GPU, a very weak phone), stop animating and keep
// the current frame. The first gap (shader compile) and pauses over 1 s are ignored; ?guard=0 turns it off.
const GUARD=Q.get('guard')!=='0'; let slow=false, gaps=[], skipGap=true;
function frame(t){ if(!running){looping=false;return;} requestAnimationFrame(frame);
  if(last && t-last<STEP-2) return;
  const sized=resize(); if((STILL || slow || __held) && drawn && !sized) return;   // still mode, too slow, or a hover tile held still: draw again only after a resize
  if(GUARD && !slow && drawn && last){ const g=t-last;
    if(skipGap) skipGap=false; else if(g<1000){ gaps.push(g); if(gaps.length===4){ gaps.sort((a,b)=>a-b); slow=gaps[2]>66; gaps=[]; } } }
  const dt=last ? Math.min(t-last,100) : STEP; last=t;
  animate(dt);
  three.setRenderTarget(rt); three.render(tScene,tCam);
  three.setRenderTarget(null); three.render(dotScene,dotCam);
  drawn=ready(); }
function start(){ if(running && !looping){ looping=true; last=0; requestAnimationFrame(frame); } }
if('IntersectionObserver' in window){ new IntersectionObserver(es=>{ running=es[0].isIntersecting; start(); }).observe(out); }
/* ===================== still mode (added for the site: reduced motion) =====================
   still=1 draws the first pose once, then stops all motion. */
if(STILL){ const __anim=animate; let __done=false; animate=function(){ if(!__done){ __done=true; __anim(); } }; }
resize(); start();
</script></body></html>
